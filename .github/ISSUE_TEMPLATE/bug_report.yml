name: Bug report
description: Report a reproducible problem in Packy
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please check existing issues first. Do not include API keys, credentials, or private user data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear, concise description.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the configuration and steps needed to reproduce the issue, after removing secrets.
      placeholder: |
        1. Open...
        2. Configure...
        3. Generate...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and target platform
      placeholder: Windows 11 x64 / windows-x64
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Pi runtime version
      placeholder: 1.0.4
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal information before pasting logs.
      render: text
